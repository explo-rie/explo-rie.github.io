<title>Dibuja el monstruo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">

<!-- =========================================================
     CSS = EL ASPECTO (colores, letras, tamaños, posiciones)
     ========================================================= -->
<style>
  :root {
    --fondo: #E6F4EF;        /* verde menta suave */
    --papel: #FFFFFF;        /* las tarjetas */
    --tinta: #1F2340;        /* el texto */
    --tinta-suave: #4A5070;
    --monstruo: #2E9E5B;     /* verde monstruo (botón) */
    --naranja: #FF8A3D;      /* la pista actual */
    --rosa: #E5487F;         /* la sorpresa final */
    --letra-titulos: "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
    --letra-texto: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
    color-scheme: light;
  }
  body { background: var(--fondo); color: var(--tinta); font-family: var(--letra-texto); font-size: 1.1rem; line-height: 1.5; }
  .pagina {
    max-width: 960px; margin: 0 auto; padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-family: var(--letra-titulos); font-weight: 800; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; margin: 0; text-align: center; text-wrap: balance; }
  .instrucciones { margin: 0 auto; max-width: 52ch; text-align: center; color: var(--tinta-suave); }

  /* Las dos columnas */
  .juego { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
  .cabecera      { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; gap: 6px; }
  .tarjeta-pista { grid-column: 1; grid-row: 2; }
  .resumen       { grid-column: 2; grid-row: 2; }
  @media (max-width: 720px) {
    .juego { grid-template-columns: minmax(0, 1fr); }
    .cabecera, .tarjeta-pista, .resumen { grid-column: auto; grid-row: auto; }
  }

  /* La tarjeta grande de la pista */
  .tarjeta-pista {
    background: var(--papel); border: 3px solid var(--tinta); border-radius: 24px;
    padding: 16px 20px; min-height: min(380px, calc(100dvh - 160px));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center;
  }
  .etiqueta { font-family: var(--letra-titulos); font-weight: 600; font-size: clamp(1.3rem, 4vw, 1.6rem); color: var(--tinta-suave); margin: 0; min-height: 1.2em; }
  .cara-dado { font-size: clamp(4rem, 10vh, 6rem); line-height: 1; color: var(--tinta); }
  .pista { font-family: var(--letra-titulos); font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.3rem); line-height: 1.15; margin: 0; max-width: 20ch; text-wrap: balance; }

  /* El botón grande del dado */
  #boton-dado {
    font-family: var(--letra-titulos); font-weight: 800; font-size: 1.4rem; color: var(--papel);
    background: var(--monstruo); border: 3px solid var(--tinta); border-radius: 999px;
    padding: 10px 30px; box-shadow: 0 5px 0 var(--tinta); cursor: pointer; margin-top: 2px;
  }
  #boton-dado:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--tinta); }
  #boton-dado:focus-visible { outline: 4px solid var(--naranja); outline-offset: 4px; }
  #boton-dado:disabled { cursor: wait; }
  #boton-dado.sorpresa { background: var(--rosa); }

  /* El resumen de pistas (columna derecha) */
  .resumen { background: var(--papel); border: 3px solid var(--tinta); border-radius: 18px; padding: 16px 18px; }
  .resumen h2 { font-family: var(--letra-titulos); font-size: 1.3rem; margin: 0 0 8px; }
  .resumen ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .resumen li { padding: 3px 10px; border-radius: 10px; border: 2px solid transparent; font-size: 0.98rem; line-height: 1.3; }
  .resumen .parte { display: block; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--tinta-suave); }
  .resumen .pendiente { color: var(--tinta-suave); }
  .resumen li.actual { border-color: var(--naranja); }

  /* El monstruo secreto */
  .zona-monstruo { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; }
  .zona-monstruo > svg { width: 100%; max-width: 320px; height: max(220px, calc(100dvh - 340px)); }
  .pregunta-final { font-family: var(--letra-titulos); font-weight: 800; font-size: 1.5rem; color: var(--rosa); margin: 0; }

  /* Animaciones: el dado tiembla y las piezas aparecen una a una */
  .temblando { animation: temblor 0.12s infinite; }
  @keyframes temblor { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  .pieza { animation: aparecer 0.5s ease-out both; transform-box: fill-box; transform-origin: center; }
  @keyframes aparecer { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .temblando, .pieza { animation: none; } }
</style>

<!-- =========================================================
     HTML = EL CONTENIDO (lo que se ve en la página)
     ========================================================= -->
<main class="pagina">
  <div class="juego">
    <header class="cabecera">
      <h1>Dibuja el monstruo</h1>
      <p class="instrucciones">Tira el dado, lee y dibuja.</p>
    </header>
    <section class="tarjeta-pista" aria-live="polite">
      <p class="etiqueta" id="etiqueta"></p>
      <div class="cara-dado" id="cara" aria-hidden="true">⚄</div>
      <p class="pista" id="pista">¡Tira el dado para empezar!</p>
      <div class="zona-monstruo" id="zona-monstruo" hidden></div>
      <button id="boton-dado" type="button">Tirar el dado</button>
    </section>
    <aside class="resumen">
      <h2>Tus pistas</h2>
      <ol id="lista-pistas"></ol>
    </aside>
  </div>
</main>

<!-- =========================================================
     JAVASCRIPT = LA INTERACCIÓN (lo que pasa al hacer clic)
     ========================================================= -->
<script>
  // =========================================================
  // 1. LOS DATOS: las 8 partes, en el orden en que se tiran.
  //    Cada parte tiene 6 pistas (una por número del dado).
  //    ¡Puedes cambiar las frases sin tocar nada más!
  //    Los dibujos son de Laurie: "cabeza-1" es el dibujo de la
  //    pista 1 de la cabeza, "cabeza-2" el de la pista 2...
  //    (Están guardados al final del archivo, en "dibujos".)
  // =========================================================
  const partes = [
    { clave: "cabeza", nombre: "La cabeza", pistas: [
        "Tiene la cabeza redonda.",
        "Tiene la cabeza cuadrada.",
        "Tiene la cabeza ovalada.",
        "Tiene la cabeza como un triángulo.",
        "Tiene la cabeza muy grande.",
        "Tiene la cabeza muy pequeña."] },
    { clave: "pelo", nombre: "El pelo", pistas: [
        "Tiene el pelo rizado.",
        "Tiene tres pelos de punta.",
        "Tiene dos cuernos.",
        "Tiene dos antenas.",
        "No tiene pelo. ¡Es calvo!",
        "Lleva una corona."] },
    { clave: "ojos", nombre: "Los ojos", pistas: [
        "Tiene un ojo grande.",
        "Tiene dos ojos.",
        "Tiene tres ojos.",
        "Tiene dos ojos y gafas.",
        "Tiene los ojos cerrados.",
        "Tiene cuatro ojos pequeños."] },
    { clave: "nariz", nombre: "La nariz", pistas: [
        "Tiene la nariz pequeña.",
        "Tiene la nariz como una zanahoria.",
        "Tiene nariz de cerdito.",
        "Tiene nariz de Pinocho.",
        "No tiene nariz.",
        "Tiene la nariz pequeña y bigote."] },
    { clave: "boca", nombre: "La boca", pistas: [
        "Tiene una boca feliz.",
        "Tiene una boca triste.",
        "Tiene un diente.",
        "Tiene muchos dientes.",
        "Tiene la boca en forma de O.",
        "Saca la lengua."] },
    { clave: "cuerpo", nombre: "El cuerpo", pistas: [
        "Tiene el cuerpo redondo.",
        "Tiene el cuerpo cuadrado.",
        "Tiene el cuerpo en forma de triángulo.",
        "Tiene el cuerpo largo y delgado.",
        "Tiene el cuerpo con rayas.",
        "Tiene el cuerpo con lunares."] },
    { clave: "brazos", nombre: "Los brazos", pistas: [
        "Tiene dos brazos cortos.",
        "Tiene dos brazos largos.",
        "Tiene cuatro brazos.",
        "No tiene brazos.",
        "Tiene un brazo.",
        "Tiene dos tentáculos."] },
    { clave: "piernas", nombre: "Las piernas", pistas: [
        "Tiene dos piernas.",
        "Tiene tres piernas.",
        "Tiene una pierna.",
        "Tiene seis patas.",
        "Tiene dos piernas muy largas.",
        "Tiene dos ruedas, no piernas."] }
  ];

  // Las caras del dado (del 1 al 6)
  const carasDado = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

  // ---------- 2. Buscamos los elementos de la página ----------
  const boton = document.getElementById("boton-dado");
  const etiqueta = document.getElementById("etiqueta");
  const cara = document.getElementById("cara");
  const pista = document.getElementById("pista");
  const zonaMonstruo = document.getElementById("zona-monstruo");
  const listaPistas = document.getElementById("lista-pistas");

  let turno = 0;          // qué parte toca (0 = cabeza, 1 = pelo...)
  let resultados = [];    // los números que han salido
  let revelado = false;   // ¿ya se ha visto el monstruo?

  // ---------- 3. El resumen de pistas (columna derecha) ----------
  function actualizarResumen() {
    listaPistas.innerHTML = "";
    partes.forEach(function (parte, i) {
      const li = document.createElement("li");
      // Naranja = la parte que acaba de salir (la última tirada)
      if (i === turno - 1 && !revelado) li.className = "actual";
      let texto = '<span class="pendiente">—</span>';
      if (resultados[i]) texto = parte.pistas[resultados[i] - 1];
      li.innerHTML = '<span class="parte">' + parte.nombre + '</span>' + texto;
      listaPistas.appendChild(li);
    });
  }

  // ---------- 4. Tirar el dado ----------
  function tirarDado() {
    // ¡La línea mágica! Un número al azar del 1 al 6
    const numero = Math.floor(Math.random() * 6) + 1;
    const parte = partes[turno];
    etiqueta.textContent = parte.nombre;
    pista.textContent = "…";
    boton.disabled = true;
    cara.classList.add("temblando");
    let vueltas = 0;
    const animacion = setInterval(function () {
      cara.textContent = carasDado[Math.floor(Math.random() * 6)];
      vueltas++;
      if (vueltas === 8) {
        clearInterval(animacion);
        cara.classList.remove("temblando");
        cara.textContent = carasDado[numero - 1];
        pista.textContent = parte.pistas[numero - 1];
        resultados[turno] = numero;
        turno++;
        boton.disabled = false;
        if (turno === partes.length) {
          boton.textContent = "¡Ver el monstruo secreto!";
          boton.classList.add("sorpresa");
        }
        actualizarResumen();
      }
    }, 70);
  }

  // ---------- 5. Colocar un dibujo ----------
  // Todos los dibujos se hicieron sobre la misma plantilla (600 × 980).
  // "mover" es una instrucción para desplazar o encoger el dibujo
  // y que encaje con la cabeza o el cuerpo que ha salido.
  // Devuelve el dibujo y lo alto/bajo que llega (para que quepa entero).
  function colocar(nombre, mover) {
    const d = dibujos[nombre];
    if (!d) return { svg: "", arriba: 9999, abajo: 0 };
    const svg = '<g transform="' + (mover ? mover.texto : "") + '">' +
                '<image href="' + d.src + '" x="' + d.x + '" y="' + d.y + '" width="' + d.w + '" height="' + d.h + '"/></g>';
    const e = mover ? mover.escalaY : 1, dy = mover ? mover.dy : 0, oy = mover ? mover.oy : 0;
    return { svg: svg, arriba: oy + (d.y - oy) * e + dy, abajo: oy + (d.y + d.h - oy) * e + dy };
  }
  // Encoge (escala) alrededor de un punto y luego lo lleva a otro punto
  function escalarDesde(ox, oy, nx, ny, escala, escalaX) {
    const ex = escalaX || escala;
    return { texto: "translate(" + nx + " " + ny + ") scale(" + ex + " " + escala + ") translate(" + (-ox) + " " + (-oy) + ")",
             escalaY: escala, dy: ny - oy, oy: oy };
  }

  // ---------- 6. Revelar el monstruo secreto ----------
  function revelarMonstruo() {
    revelado = true;
    const n = resultados;                 // n[0] = número de la cabeza, n[1] = del pelo...
    const cab = ajustes.cabezas[n[0] - 1];
    const cue = ajustes.cuerpos[n[5] - 1];
    const piezas = [];

    // Piernas: debajo del cuerpo (más estrechas si el cuerpo es delgado)
    const p = ajustes.piernas[n[7] - 1][n[5] - 1];
    piezas.push(colocar("piernas-" + n[7], { texto: "translate(" + p.cx + " " + p.dy + ") scale(" + p.sx + " 1) translate(" + (-p.cx) + " 0)", escalaY: 1, dy: p.dy, oy: 0 }));

    // Brazos: el izquierdo y el derecho se pegan cada uno a su lado del cuerpo
    const b = ajustes.brazos[n[6] - 1] ? ajustes.brazos[n[6] - 1][n[5] - 1] : null;
    if (b) {
      const d = dibujos["brazos-" + n[6]];
      let svg = "";
      [["i", 0], ["d", 300]].forEach(function (lado) {
        if (b[lado[0]] === null) return;
        svg += '<svg x="' + (lado[1] + b[lado[0]]) + '" y="0" width="300" height="980" viewBox="' + lado[1] + ' 0 300 980" overflow="hidden">' +
               '<image href="' + d.src + '" x="' + d.x + '" y="' + d.y + '" width="' + d.w + '" height="' + d.h + '"/></svg>';
      });
      piezas.push({ svg: svg, arriba: d.y, abajo: d.y + d.h });
    } else piezas.push({ svg: "", arriba: 9999, abajo: 0 });

    // Cuerpo (tal como lo dibujaste)
    piezas.push(colocar("cuerpo-" + n[5]));

    // Sin cuello: bajamos la cabeza (con su pelo y su cara) hasta que toque el cuerpo.
    // abajoCabeza = dónde termina cada cabeza en tu dibujo (pistas 1 a 6)
    const abajoCabeza = [387, 396, 368, 390, 378, 353];
    const bajar = cue.top + 10 - abajoCabeza[n[0] - 1];

    // Pelo: sobre la parte de arriba de la cabeza
    piezas.push(colocar("pelo-" + n[1], escalarDesde(300, 150, cab.cx, cab.top + bajar, cab.hs)));

    // Cabeza
    piezas.push(colocar("cabeza-" + n[0], { texto: "translate(0 " + bajar + ")", escalaY: 1, dy: bajar, oy: 0 }));

    // Ojos, nariz y boca: se encogen y se mueven según la cabeza
    const ajusteCara = escalarDesde(300, 268, cab.cx, cab.cy + bajar, cab.s);
    piezas.push(colocar("ojos-" + n[2], ajusteCara));
    piezas.push(colocar("nariz-" + n[3], ajusteCara));
    piezas.push(colocar("boca-" + n[4], ajusteCara));

    // Lo que ocupa el monstruo, para que quepa entero en el recuadro
    const arriba = Math.min(0, Math.min.apply(null, piezas.map(x => x.arriba))) - 10;
    const abajo = Math.max(980, Math.max.apply(null, piezas.map(x => x.abajo))) + 10;

    let contenido = "";
    piezas.forEach(function (x, i) {
      contenido += '<g class="pieza" style="animation-delay:' + (i * 0.3) + 's">' + x.svg + '</g>';
    });
    const descripcion = partes.map((parte, i) => parte.pistas[n[i] - 1]).join(" ");
    zonaMonstruo.innerHTML =
      '<svg viewBox="0 ' + arriba + ' 600 ' + (abajo - arriba) + '" role="img" aria-label="El monstruo secreto. ' + descripcion + '">' +
        contenido + '</svg>' +
      '<p class="pregunta-final">¿Es similar a tu dibujo?</p>';

    etiqueta.textContent = "¡Sorpresa!";
    cara.hidden = true;
    pista.hidden = true;
    zonaMonstruo.hidden = false;
    boton.textContent = "Otro monstruo";
    boton.classList.remove("sorpresa");
    actualizarResumen();
  }

  // ---------- 7. Empezar de nuevo ----------
  function empezar() {
    turno = 0;
    resultados = [];
    revelado = false;
    etiqueta.textContent = "";
    cara.textContent = "⚄";
    cara.hidden = false;
    pista.hidden = false;
    pista.textContent = "¡Tira el dado para empezar!";
    zonaMonstruo.hidden = true;
    zonaMonstruo.innerHTML = "";
    boton.textContent = "Tirar el dado";
    actualizarResumen();
  }

  // ---------- 8. ¿Qué hace el botón? Depende del momento ----------
  boton.addEventListener("click", function () {
    if (turno < partes.length) tirarDado();
    else if (!revelado) revelarMonstruo();
    else empezar();
  });
</script>
